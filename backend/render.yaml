services:
  - type: web
    name: govt-app-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: govt-app-db
          property: connectionString

databases:
  - name: govt-app-db
    plan: free
    databaseName: govtapp
    user: govtapp
